[project]
name = "touchless-projection-mapping"
version = "2.0.0"
description = "Touchless interactive projection mapping with AI computer vision and IoT hardware control."
license = "GPL-3.0-only"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-kasa>=0.10.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.22",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/vision",
    "src/backend",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: requires a physical device on the LAN (skipped by default)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore::DeprecationWarning",
]
