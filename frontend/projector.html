<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyector de Pared - Brazo Digital Interactivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none; /* Ocultar cursor en la proyección física */
        }

        #projection-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: #000000;
            transform-origin: center center;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* Capa 1: Video de Fondo para Mapping Dinámico */
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
            filter: brightness(70%);
            transition: filter 0.2s ease;
        }

        /* Capa 2: Stream de Visión CUDA (Ultra-baja latencia, fondo negro puro con brazo holográfico) */
        #cuda-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 2;
            mix-blend-mode: screen; /* Fusión óptica: negro es 100% transparente sobre la pared */
            display: block;
        }

        /* Capa 2 alternativa: Canvas para Modos Web Fallback */
        #web-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            mix-blend-mode: screen;
            display: none;
        }

        /* Aviso discreto que se desvanece tras 3.5 segundos */
        #init-notice {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(0, 255, 255, 0.4);
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="projection-container">
        <!-- Video de Fondo (Capa 1) -->
        <video id="bg-video" autoplay loop muted playsinline></video>

        <!-- Stream Holográfico CUDA (Capa 2) -->
        <img id="cuda-stream" src="/stream" alt="" />

        <!-- Canvas de Renderizado Web (Capa 2 alternativa) -->
        <canvas id="web-canvas" width="1920" height="1080"></canvas>

        <div id="init-notice">🖥️ Pantalla Proyector Activa | Presiona [F] o [F11] para Pantalla Completa</div>
    </div>

    <script>
        // ─────────────────────────────────────────────────────────────────────
        //  PANTALLA PROYECTOR: PARED DE INTERACCIÓN Y PROYECCIÓN HOLOGRÁFICA
        //  Regla fundamental: SOLO el brazo/mano sobre fondo negro puro (#000000)
        //  o video de fondo si está activado. CERO HUD, CERO BOTONES, CERO MENÚS.
        // ─────────────────────────────────────────────────────────────────────

        const container = document.getElementById('projection-container');
        const bgVideo = document.getElementById('bg-video');
        const cudaStream = document.getElementById('cuda-stream');
        const webCanvas = document.getElementById('web-canvas');
        const webCtx = webCanvas.getContext('2d');
        const initNotice = document.getElementById('init-notice');

        let currentVideoBlobUrl = null;
        let lastFrameImg = new Image();
        let currentKnownBackbone = '';

        // Desvanecer aviso inicial
        setTimeout(() => {
            if (initNotice) {
                initNotice.style.opacity = '0';
                setTimeout(() => initNotice.remove(), 1600);
            }
        }, 3500);

        // Auto-escalado responsivo: cubre el 100% de la pantalla sin dejar franjas laterales ni verticales
        function fitProjector() {
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            const scale = Math.max(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', fitProjector);
        fitProjector();

        // Control de pantalla completa con F, F11 o doble clic
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });
        document.addEventListener('dblclick', toggleFullscreen);

        // ─────────────────────────────────────────────────────────────────────
        //  CANAL DE COMUNICACIÓN EN TIEMPO REAL (BroadcastChannel)
        // ─────────────────────────────────────────────────────────────────────
        const primaryChannel = new BroadcastChannel('hand_projection_channel');
        const legacyChannel = new BroadcastChannel('digital_arm_channel');

        function refreshStream() {
            cudaStream.style.display = 'block';
            webCanvas.style.display = 'none';
            cudaStream.src = '/stream?t=' + Date.now();
        }

        function handleMessage(event) {
            const data = event.data;
            if (!data) return;

            // 1. Conmutación de modelo (CUDA vs Navegador)
            if (data.type === 'mode_change' || data.type === 'model_changed') {
                if (data.isWeb) {
                    cudaStream.style.display = 'none';
                    webCanvas.style.display = 'block';
                } else {
                    refreshStream();
                }
            }

            // 2. Fotograma en vivo desde motor Web Fallback
            else if (data.type === 'stream') {
                if (webCanvas.style.display !== 'block') {
                    cudaStream.style.display = 'none';
                    webCanvas.style.display = 'block';
                }
                lastFrameImg.onload = () => {
                    webCtx.clearRect(0, 0, 1920, 1080);
                    webCtx.drawImage(lastFrameImg, 0, 0, 1920, 1080);
                };
                lastFrameImg.src = data.image;
            }

            // 3. Gestión de Video de Fondo
            else if (data.type === 'set_bg_video') {
                if (currentVideoBlobUrl) {
                    URL.revokeObjectURL(currentVideoBlobUrl);
                    currentVideoBlobUrl = null;
                }

                if (data.blob) {
                    currentVideoBlobUrl = URL.createObjectURL(data.blob);
                    bgVideo.src = currentVideoBlobUrl;
                } else if (data.url) {
                    bgVideo.src = data.url;
                }

                if (data.brightness !== undefined) {
                    bgVideo.style.filter = `brightness(${data.brightness}%)`;
                }

                bgVideo.style.display = 'block';
                bgVideo.play().catch(err => console.warn('Auto-play prevenido:', err));
            }

            else if (data.type === 'toggle_bg_video') {
                if (bgVideo.paused) {
                    bgVideo.play().catch(err => console.warn('Error al reproducir:', err));
                } else {
                    bgVideo.pause();
                }
            }

            else if (data.type === 'update_bg_video') {
                if (data.brightness !== undefined) {
                    bgVideo.style.filter = `brightness(${data.brightness}%)`;
                }
            }

            else if (data.type === 'clear_bg_video') {
                bgVideo.pause();
                bgVideo.removeAttribute('src');
                bgVideo.load();
                bgVideo.style.display = 'none';
                if (currentVideoBlobUrl) {
                    URL.revokeObjectURL(currentVideoBlobUrl);
                    currentVideoBlobUrl = null;
                }
            }
        }

        primaryChannel.onmessage = handleMessage;
        legacyChannel.onmessage = handleMessage;

        // Notificar al controlador que la ventana de proyección está lista
        primaryChannel.postMessage({ type: 'projection_ready' });
        legacyChannel.postMessage({ type: 'projection_ready' });

        // Watchdog de reconexión si el stream CUDA se interrumpe
        cudaStream.onerror = () => {
            setTimeout(refreshStream, 800);
        };

        // Sondeo de seguridad (/api/status) para auto-recuperación de stream
        setInterval(async () => {
            try {
                const res = await fetch('/api/status', { cache: 'no-store' });
                if (res.ok) {
                    const st = await res.json();
                    if (st.backbone && currentKnownBackbone && st.backbone !== currentKnownBackbone) {
                        currentKnownBackbone = st.backbone;
                        refreshStream();
                    } else if (st.backbone && !currentKnownBackbone) {
                        currentKnownBackbone = st.backbone;
                    }
                }
            } catch (err) {}
        }, 1500);
    </script>
</body>
</html>
